<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#07090e" />
      <stop offset="100%" stop-color="#0f172a" />
    </linearGradient>
    <linearGradient id="glowGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#00f2fe" />
      <stop offset="50%" stop-color="#4facfe" />
      <stop offset="100%" stop-color="#7c3aed" />
    </linearGradient>
    <filter id="neonGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="12" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Base Rounded Container -->
  <rect x="32" y="32" width="448" height="448" rx="96" fill="url(#bgGrad)" stroke="url(#glowGrad)" stroke-width="12" />
  
  <!-- Outer Circuit Glow Ring -->
  <rect x="48" y="48" width="416" height="416" rx="80" fill="none" stroke="rgba(0,242,254,0.15)" stroke-width="6" />

  <!-- Neural Nodes & Connections -->
  <g stroke="url(#glowGrad)" stroke-width="8" stroke-linecap="round" opacity="0.85">
    <line x1="140" y1="140" x2="220" y2="220" />
    <line x1="372" y1="140" x2="292" y2="220" />
    <line x1="256" y1="220" x2="256" y2="360" />
    <line x1="140" y1="360" x2="220" y2="360" />
    <line x1="372" y1="360" x2="292" y2="360" />
  </g>

  <!-- Neural Node Dots -->
  <circle cx="140" cy="140" r="16" fill="#00f2fe" filter="url(#neonGlow)" />
  <circle cx="372" cy="140" r="16" fill="#7c3aed" filter="url(#neonGlow)" />
  <circle cx="140" cy="360" r="14" fill="#00f2fe" />
  <circle cx="372" cy="360" r="14" fill="#7c3aed" />
  <circle cx="256" cy="220" r="20" fill="#00f2fe" filter="url(#neonGlow)" />

  <!-- Center Monogram Text KT -->
  <text x="256" y="315" font-family="'Plus Jakarta Sans', system-ui, sans-serif" font-weight="900" font-size="160" fill="#ffffff" text-anchor="middle" letter-spacing="-6">KT</text>
</svg>
